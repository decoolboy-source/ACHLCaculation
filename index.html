<style id="design-system">
/* ═══ MultiHVAC Design System v2 — Dark Navy Professional Theme ══ */
:root{
  --bg-app:#060e1c; --bg-surface:#0c1a2e; --bg-raised:#122032;
  --bg-input:#07111e; --border-dim:#1a3050; --border-def:#234168;
  --border-hi:#10b981; --text-hi:#edf2f8; --text-mid:#8eaac2;
  --text-low:#4a6680; --accent:#10b981; --accent-lt:#34d399;
}

/* Base */
body { background:var(--bg-app) !important; color:var(--text-hi) !important; }
* { box-sizing:border-box; }

/* ── PWA Safe Area (BUG FIX) ─────────────────────────────────────────────
   viewport-fit=cover (đặt ở <meta name="viewport">) cho phép app tràn hết
   màn hình kể cả vùng notch/tai thỏ/thanh trạng thái — ĐÚNG cho trải nghiệm
   app thật, nhưng bắt buộc phải tự bù padding cho vùng đó, nếu không phần
   header (nút Menu, tiêu đề...) sẽ nằm NGAY DƯỚI/ĐÈ LÊN thanh trạng thái hệ
   thống (giờ, pin, sóng) — vừa bị che chữ, vừa không bấm được vì vùng đó
   trên nhiều điện thoại/iOS bị hệ thống chiếm quyền chạm (vuốt xuống, notch
   gesture...). Lỗi này CHỈ xuất hiện khi cài PWA vào màn hình chính (chế độ
   "standalone") — mở qua trình duyệt bình thường có thanh địa chỉ che chắn
   sẵn nên không thấy vấn đề, đó là lý do lỗi này bị bỏ sót cho tới khi có
   người thực tế cài ra màn hình chính rồi báo lại.
   Giải pháp: cộng thêm env(safe-area-inset-*) vào padding 4 phía của body
   và riêng header (nơi có nút bấm) cộng thêm ở đỉnh để đẩy nút Menu xuống
   dưới vùng notch/status bar, đảm bảo luôn bấm được. */
body{
  padding-left:env(safe-area-inset-left);
  padding-right:env(safe-area-inset-right);
  padding-bottom:env(safe-area-inset-bottom);
}
#app-header{
  padding-top:max(0.625rem, env(safe-area-inset-top)) !important;
}
#mobile-nav{
  padding-top:max(0.75rem, env(safe-area-inset-top)) !important;
  padding-bottom:env(safe-area-inset-bottom);
}
/* FIX (lớp bảo vệ dự phòng): nếu env(safe-area-inset-top) vì lý do gì đó không phân giải
   đúng (phiên bản WebKit cũ, thiết bị lạ...), 0.625rem/0.75rem fallback phía trên có thể
   không đủ để tránh vùng status bar thật (thường ~44px trên iPhone có notch/Dynamic
   Island). Khi ĐÃ CHẮC CHẮN đang chạy dạng cài đặt PWA (display-mode: standalone), ép thêm
   1 mức padding tối thiểu an toàn hơn, không phụ thuộc hoàn toàn vào env(). */
@media (display-mode: standalone){
  #app-header{ padding-top:max(2.75rem, env(safe-area-inset-top)) !important; }
  #mobile-nav{ padding-top:max(2.75rem, env(safe-area-inset-top)) !important; }
}

/* FIX (nguyên nhân THẬT của lỗi cuộn chuột trên PC — phản hồi thực tế): #app-root dùng
   class Tailwind "min-h-screen" (min-height:100vh) — CHỈ đặt chiều cao TỐI THIỂU, không
   phải chiều cao CỐ ĐỊNH, nên toàn bộ app có thể phình to hơn viewport theo nội dung. Hậu
   quả: #tab-content (vùng nội dung chính, đã có overflow-y:auto + min-h-0 từ trước) không
   bao giờ THỰC SỰ bị ép phải cuộn nội bộ — vì "chỗ trống" bên trong app-root luôn đủ lớn để
   chứa hết nội dung mà không cần cuộn — nên cả TRANG (qua body/html) mới là thứ thực sự
   cuộn, không phải #tab-content. Khi trỏ chuột vào GIỮA #tab-content, sự kiện cuộn bị lớp
   overflow-y:auto (dù không hoạt động hết công suất) "giữ lại" một phần, không cho lọt lên
   cuộn trang; khi trỏ ra #sidebar (không có overflow riêng), sự kiện cuộn lọt thẳng lên
   cuộn cả trang — đúng khớp hiện tượng "phải rê chuột ra sidebar mới cuộn được". Chỉ ép
   chiều cao CỐ ĐỊNH (không phải min) ở desktop (≥768px) — giữ nguyên hành vi mobile (đang
   ổn định, có thanh điều hướng dưới cùng cố định dựa vào cuộn trang bình thường). */
@media (min-width: 768px){
  #app-root{ height:100vh; }
}

/* ── Inputs / Selects ── */
input:not([type=checkbox]):not([type=radio]):not([type=range]),
select, textarea {
  background:var(--bg-input) !important;
  border:1.5px solid var(--border-def) !important;
  border-radius:8px !important;
  color:var(--text-hi) !important;
  padding:9px 12px !important;
  font-size:13px !important;
  transition:border-color .15s, box-shadow .15s !important;
  outline:none !important;
  -webkit-appearance:none !important;
  appearance:none !important;
}
input:focus, select:focus, textarea:focus {
  border-color:var(--border-hi) !important;
  box-shadow:0 0 0 3px rgba(16,185,129,.15) !important;
}
input::placeholder, textarea::placeholder { color:var(--text-low) !important; opacity:1 !important; }
select option { background:#0c1a2e; color:#edf2f8; }

/* ── Labels ── */
label {
  display:block !important;
  color:var(--text-mid) !important;
  font-size:11px !important;
  font-weight:600 !important;
  letter-spacing:.03em !important;
  margin-bottom:4px !important;
}

/* ── Panels ── */
section[id^="panel-"] {
  background:var(--bg-surface) !important;
  border:1px solid var(--border-dim) !important;
  border-radius:12px !important;
  box-shadow:0 4px 20px rgba(0,0,0,.45) !important;
  overflow:hidden !important;
}
.panel-toggle {
  background:linear-gradient(135deg,#122032 0%,#0c1a2e 100%) !important;
  border-bottom:1px solid var(--border-dim) !important;
  padding:13px 16px !important;
  min-height:48px !important;
  transition:background .15s !important;
  width:100%; text-align:left; display:flex; align-items:center;
  justify-content:space-between; cursor:pointer;
}
.panel-toggle:hover { background:linear-gradient(135deg,#18293e 0%,#0f1f33 100%) !important; }
.panel-body { padding:16px !important; background:var(--bg-surface) !important; }
.panel-collapsed .panel-body { display:none !important; }

/* ── Header ── */
header {
  background:rgba(6,14,28,.97) !important;
  border-bottom:1px solid var(--border-dim) !important;
  box-shadow:0 2px 12px rgba(0,0,0,.5) !important;
}

/* ── Sidebar ── */
#sidebar {
  background:rgba(6,14,28,.98) !important;
  border-right:1px solid var(--border-dim) !important;
}
.nav-btn {
  border:1px solid transparent !important;
  border-radius:8px !important;
  padding:9px 12px !important;
  color:var(--text-mid) !important;
  font-size:13px !important;
  font-weight:500 !important;
  transition:all .15s !important;
  cursor:pointer !important;
  background:none !important;
  width:100%; text-align:left; display:flex; align-items:center; gap:10px;
}
.nav-btn:hover {
  background:rgba(16,185,129,.08) !important;
  color:var(--text-hi) !important;
  border-color:rgba(16,185,129,.15) !important;
}
.nav-btn.tab-active {
  background:rgba(16,185,129,.12) !important;
  color:#34d399 !important;
  border-color:rgba(16,185,129,.25) !important;
  font-weight:600 !important;
}

/* ── Tables ── */
th {
  background:#071325 !important;
  color:var(--text-mid) !important;
  font-size:10px !important;
  font-weight:700 !important;
  text-transform:uppercase !important;
  letter-spacing:.05em !important;
  padding:10px !important;
  border-bottom:1px solid var(--border-def) !important;
  white-space:nowrap !important;
}
td { border-bottom:1px solid rgba(26,48,80,.5) !important; color:var(--text-hi) !important; }
tbody tr:hover td { background:rgba(16,185,129,.03) !important; }
.zebra > tbody > tr:nth-child(even) td { background:rgba(7,19,37,.7) !important; }

/* ── Room rows (floor hierarchy) ── */
.room-hd {
  background:linear-gradient(90deg,#0f1e30 0%,#0c1825 100%) !important;
  border-bottom:1px solid #0f1e30 !important;
  transition:background .15s !important;
  cursor:pointer !important;
}
.room-hd:hover { background:linear-gradient(90deg,#152840 0%,#111f30 100%) !important; }
.floor-header { cursor:default !important; }

/* ── Mobile drawer ── */
#mobile-drawer { backdrop-filter:blur(4px); }
#mobile-nav { background:rgba(6,14,28,.98) !important; }

/* ── Text colors ── */
.text-emerald-400 { color:#34d399 !important; }
.text-amber-400   { color:#fbbf24 !important; }
.text-red-400     { color:#f87171 !important; }
.text-cyan-400    { color:#22d3ee !important; }
.text-violet-400  { color:#c084fc !important; }
.text-slate-200   { color:#e2e8f0 !important; }
.text-slate-300   { color:#c8d8e8 !important; }
.text-slate-400   { color:var(--text-mid) !important; }
.text-slate-500   { color:var(--text-low) !important; }
.text-white       { color:#ffffff !important; }

/* ── Buttons ── */
button[style*="background:#059669"],
button[style*="background:#0d7a4f"],
button[style*="background:#b91c1c"],
button[style*="background:#047857"] {
  font-weight:600 !important;
}

/* ── Sub-panels (sections inside forms) ── */
.bg-slate-900\/60,
.bg-base-900\/60,
.bg-base-900\/50 {
  background:rgba(7,17,30,.6) !important;
  border-radius:8px !important;
}

/* ── Scrollbars ── */
::-webkit-scrollbar { width:5px; height:5px; }
::-webkit-scrollbar-thumb { background:#234168; border-radius:5px; }
::-webkit-scrollbar-thumb:hover { background:#2d5280; }
::-webkit-scrollbar-track { background:transparent; }

/* ── Tab content ── */
#tab-content { background:transparent !important; }
.tab-panel.hidden { display:none !important; }

/* ── Mobile responsive ── */
@media(max-width:640px){
  .panel-body { padding:12px !important; }
  .panel-toggle { padding:11px 14px !important; }
  label { font-size:12px !important; }
  input:not([type=checkbox]):not([type=radio]),
  select { font-size:14px !important; min-height:44px !important; }
}

/* ── Tab Data (Admin) scroll fix ── */
#panel-admin { overflow-y: auto !important; }

/* ── Room drawer form inputs ── */
#room-drawer-body input:not([type=checkbox]):not([type=radio]),
#room-drawer-body select,
#room-drawer-body textarea {
  background:#07111e !important;
  border:1.5px solid #234168 !important;
  color:#edf2f8 !important;
  border-radius:8px !important;
  padding:9px 12px !important;
  width:100% !important;
  display:block !important;
  visibility:visible !important;
  opacity:1 !important;
}
#room-drawer-body input:focus,
#room-drawer-body select:focus {
  border-color:#10b981 !important;
  outline:none !important;
  box-shadow:0 0 0 3px rgba(16,185,129,.15) !important;
}
#room-drawer-body label {
  color:#8eaac2 !important;
  font-size:11px !important;
  font-weight:600 !important;
  display:block !important;
  margin-bottom:4px !important;
  visibility:visible !important;
}

/* ── Room drawer ── */
#room-drawer-panel {
  background:#0c1a2e !important;
  border-left:1px solid #1a3050 !important;
}

/* ── Status bar ── */
#status-bar {
  background:rgba(6,14,28,.97) !important;

  color:var(--text-low) !important;
  font-size:11px !important;

/* ══ FIX 4: Duct table responsive + mobile touch scroll ══ */

/* Container vuốt ngang */
.duct-table-wrapper {
  /* KEY FIX: constrain wrapper to parent width */
  display: block !important;
  width: 100% !important;
  max-width: 100% !important;
  box-sizing: border-box !important;
  overflow-x: auto !important;
  -webkit-overflow-scrolling: touch !important;
  touch-action: pan-x pan-y !important;
  overscroll-behavior-x: contain !important;
  /* Shadow gradient chỉ dẫn scroll */
  background: var(--bg-surface);
}

/* Table bên trong: không bị co lại */
.duct-table-wrapper > table {
  min-width: 1200px !important;
  width: max-content !important;
  border-collapse: separate !important;
  border-spacing: 0 !important;
  table-layout: fixed !important;
}

/* ── FIX: Dark mode input text visibility ── */
.duct-table-wrapper input,
.duct-table-wrapper select {
  background: #07111e !important;
  color: #edf2f8 !important;
  border: 1.5px solid #234168 !important;
  border-radius: 6px !important;
  /* FIX: font-size 16px → tránh iOS auto-zoom làm vỡ layout */
  font-size: 16px !important;
  padding: 6px 8px !important;
  min-height: 36px !important;
  -webkit-appearance: none !important;
  appearance: none !important;
}
.duct-table-wrapper input:focus,
.duct-table-wrapper select:focus {
  border-color: #10b981 !important;
  outline: none !important;
}

/* ── Branch table header sticky ── */
.duct-table-wrapper thead {
  position: sticky !important;
  top: 0 !important;
  z-index: 3 !important;
  background: #071325 !important;
}
.duct-table-wrapper th {
  white-space: nowrap !important;
  padding: 9px 8px !important;
  font-size: 10px !important;
  font-weight: 700 !important;
  text-transform: uppercase !important;
  letter-spacing: .05em !important;
  color: #8eaac2 !important;
  border-bottom: 1px solid #234168 !important;
}
.duct-table-wrapper td {
  vertical-align: top !important;
  padding: 6px 6px !important;
  border-bottom: 1px solid rgba(26,48,80,.4) !important;
}
.duct-table-wrapper tbody tr:hover td {
  background: rgba(16,185,129,.03) !important;
}

/* Critical path row highlight */
.duct-table-wrapper tr.is-critical { 
  background: rgba(251,191,36,.04) !important;
  border-left: 2px solid #fbbf24 !important;
}

/* KEY: min-width:0 trên toàn bộ chain để chặn flex/grid stretch */
#panel-calc {
  overflow-x: hidden !important; /* clip fallback */
  min-width: 0 !important;
  width: 100% !important;
}
#panel-calc > .grid,
#panel-calc > .space-y-4,
#panel-calc > div {
  min-width: 0 !important;
  max-width: 100% !important;
}
#panel-calc .grid > div,
#panel-calc .md\:col-span-2 {
  min-width: 0 !important;
  max-width: 100% !important;
  overflow-x: hidden !important; /* ngăn grid item stretch */
}
/* Mở lại overflow cho wrapper để scroll hoạt động */
#panel-calc .duct-table-wrapper {
  overflow-x: auto !important;
  overflow-y: visible !important;
}

/* Scroll indicator badge */
.duct-scroll-hint {
  display: none;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: #4a6680;
  margin-bottom: 6px;
}
@media (max-width: 768px) {
  .duct-scroll-hint { display: flex !important; }
  /* Tăng touch target cho nút trong bảng */
  .duct-table-wrapper button {
    min-width: 32px !important;
    min-height: 32px !important;
    padding: 6px !important;
  }
}

/* ── Branch table (duct design) ── */
.branch-table input, .branch-table select,
table[class*="zebra"] input, table[class*="zebra"] select,
table input[data-brow], table select[data-brow] {

/* Placeholder visibility ── */

textarea::placeholder {

  <!-- PWA Service Worker — chỉ đăng ký khi:
       - Chạy qua HTTPS (không phải file://)
       - Không phải WKWebView/in-app browser (iOS không cho SW non-app-bound domain)
       - navigator.serviceWorker tồn tại
  -->
  <script>
  (function(){
    // Detect WKWebView / in-app browser — SW sẽ fail ở đây
    const isWKWebView = /iPhone|iPad|iPod/.test(navigator.userAgent) &&
      !window.MSStream && !/Safari\//.test(navigator.userAgent);
    const isFileProtocol = location.protocol === 'file:';
    const hasSW = 'serviceWorker' in navigator;

    if(!hasSW || isFileProtocol || isWKWebView) return; // Skip silently

    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('./sw.js', {scope:'./'})
        .then(()=>{}) // silent success
        .catch(()=>{  // silent fail — SW là progressive enhancement
        });
    });
  })();
  </script>
